name: service-platform

services:
  # One-shot init container that fixes ownership/permissions on the shared
  # Learning Transport folder. The ServiceControl images run as a non-root
  # user, and a fresh bind-mounted host directory may not be writable by
  # that user depending on host OS/umask, which causes
  # UnauthorizedAccessException when the app tries to create its queue
  # directories. This runs once, chmods the folder, then exits.
  learningtransport-init:
    image: busybox
    command: ["sh", "-c", "mkdir -p /learningtransport && chmod -R 0777 /learningtransport"]
    volumes:
      - ./learningtransport:/learningtransport

  servicecontrol:
    image: particular/servicecontrol:${SERVICECONTROL_TAG}
    env_file: .env
    ports:
      - "33333:33333"
    environment:
      RAVENDB_CONNECTIONSTRING: http://servicecontrol-db:8080
      REMOTEINSTANCES: '[{"api_uri":"http://servicecontrol-audit:44444/api"}]'
    command: --setup-and-run
    restart: unless-stopped
    volumes:
      - ./learningtransport:/learningtransport
    depends_on:
      servicecontrol-db:
        condition: service_healthy
      learningtransport-init:
        condition: service_completed_successfully

  # WARNING: A single database container should not be shared between multiple ServiceControl instances in production scenarios.
  servicecontrol-db:
    image: particular/servicecontrol-ravendb:${SERVICECONTROL_TAG}
    ports:
      - "8080:8080"
    volumes:
      - raven-config:/var/lib/ravendb/config
      - raven-data:/var/lib/ravendb/data

  servicecontrol-audit:
    image: particular/servicecontrol-audit:${SERVICECONTROL_TAG}
    env_file: .env
    ports:
      - "44444:44444"
    environment:
      RAVENDB_CONNECTIONSTRING: http://servicecontrol-db:8080
      SERVICECONTROLQUEUEADDRESS: Particular.ServiceControl
    command: --setup-and-run
    restart: unless-stopped
    volumes:
      - ./learningtransport:/learningtransport
    depends_on:
      servicecontrol-db:
        condition: service_healthy
      learningtransport-init:
        condition: service_completed_successfully

  servicecontrol-monitoring:
    image: particular/servicecontrol-monitoring:${SERVICECONTROL_TAG}
    env_file: .env
    restart: unless-stopped
    command: --setup-and-run
    ports:
      - "33633:33633"
    volumes:
      - ./learningtransport:/learningtransport
    depends_on:
      learningtransport-init:
        condition: service_completed_successfully

  servicepulse:
    image: particular/servicepulse:${SERVICEPULSE_TAG}
    ports:
      - "9090:9090"
    environment:
      SERVICECONTROL_URL: http://servicecontrol:33333
      MONITORING_URL: http://servicecontrol-monitoring:33633
    restart: unless-stopped
    depends_on:
      servicecontrol:
        condition: service_healthy
      servicecontrol-monitoring:
        condition: service_healthy

  # Containerized ServiceControl.SmokeTest (see smoketest/Dockerfile).
  # Preconfigured to share the same Learning Transport folder used by ServiceControl,
  # so a user can exec into it and run the tool's `learning-transport` command against
  # the same storage directory. No image is pushed to a registry; it's built locally
  # by `docker compose build` / `docker compose up`.
  smoketest:
    build:
      context: ./smoketest
    volumes:
      - ./learningtransport:/learningtransport
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "which", "servicecontrol-smoketest"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      servicecontrol:
        condition: service_healthy
      servicecontrol-audit:
        condition: service_started
      servicecontrol-monitoring:
        condition: service_started
      learningtransport-init:
        condition: service_completed_successfully

volumes:
  raven-config:
  raven-data:
